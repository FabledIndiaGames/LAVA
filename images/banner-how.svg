<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g>
    <rect x="80" y="56" width="76" height="76" rx="14" fill="#F05252"/>
    <text x="118" y="94" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">LAVA</text>
    <g fill="#fff">
      <rect x="92" y="102" width="4" height="10" rx="2"/>
      <rect x="99" y="98" width="4" height="18" rx="2"/>
      <rect x="106" y="104" width="4" height="7" rx="2"/>
      <rect x="113" y="96" width="4" height="22" rx="2"/>
      <rect x="120" y="104" width="4" height="7" rx="2"/>
      <rect x="127" y="98" width="4" height="18" rx="2"/>
      <rect x="134" y="102" width="4" height="10" rx="2"/>
    </g>
  </g>
  <text x="76" y="260" font-size="104" font-weight="800" fill="#16161A">Click. Speak. Done.</text>
  <g>
    <rect x="80" y="330" width="440" height="470" rx="32" fill="#F4F4F6"/>
    <text x="130" y="440" font-size="72" font-weight="800" fill="#F05252">1</text>
    <text x="130" y="520" font-size="44" font-weight="bold" fill="#16161A">Click Mic &amp;</text>
    <text x="130" y="572" font-size="44" font-weight="bold" fill="#16161A">speak</text>
    <text x="130" y="660" font-size="30" fill="#666666">...or just type —</text>
    <text x="130" y="702" font-size="30" fill="#666666">both work.</text>
    <rect x="580" y="330" width="440" height="470" rx="32" fill="#F4F4F6"/>
    <text x="630" y="440" font-size="72" font-weight="800" fill="#F05252">2</text>
    <text x="630" y="520" font-size="44" font-weight="bold" fill="#16161A">Get the answer</text>
    <text x="630" y="572" font-size="44" font-weight="bold" fill="#16161A">in seconds</text>
    <text x="630" y="660" font-size="30" fill="#666666">...not minutes.</text>
    <text x="630" y="702" font-size="30" fill="#666666">No queues.</text>
    <rect x="1080" y="330" width="440" height="470" rx="32" fill="#F05252"/>
    <text x="1130" y="440" font-size="72" font-weight="800" fill="#ffffff">3</text>
    <text x="1130" y="520" font-size="44" font-weight="bold" fill="#ffffff">Listen, save</text>
    <text x="1130" y="572" font-size="44" font-weight="bold" fill="#ffffff">or print</text>
    <text x="1130" y="660" font-size="30" fill="#ffffff">...keep it as PDF</text>
    <text x="1130" y="702" font-size="30" fill="#ffffff">or paper.</text>
  </g>
</svg>

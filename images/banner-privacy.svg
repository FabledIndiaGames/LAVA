<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="880" height="900" fill="#F05252"/>
  <g fill="#fff">
    <path d="M168 92 L104 120 L168 148 L232 120 Z"/>
    <path d="M132 132 v34 c30 26 102 26 132 0 v-34 l-66 26 Z"/>
    <rect x="228" y="112" width="7" height="26" rx="3.5"/>
    <circle cx="231.5" cy="146" r="6"/>
  </g>
  <text x="104" y="250" font-size="60" font-weight="bold" letter-spacing="-2" fill="#fff">LAVA</text>
  <text x="76" y="420" font-size="98" font-weight="800" fill="#ffffff">Your words</text>
  <text x="76" y="528" font-size="98" font-weight="800" fill="#ffffff">never leave</text>
  <text x="76" y="636" font-size="98" font-weight="800" fill="#ffffff">your PC.</text>
  <text x="80" y="716" font-size="33" fill="#ffffff">No backend AI server. Zero telemetry.</text>
  <text x="80" y="762" font-size="33" fill="#ffffff">No data collection.</text>
  <g>
    <rect x="950" y="90" width="570" height="210" rx="28" fill="#F2F2F4"/>
    <circle cx="1020" cy="165" r="26" fill="none" stroke="#F05252" stroke-width="9"/>
    <path d="M1020 150 v30 M1005 165 h30" stroke="#F05252" stroke-width="9" stroke-linecap="round"/>
    <text x="1065" y="162" font-size="38" font-weight="bold" fill="#16161A">On-device AI assistant</text>
    <text x="1065" y="208" font-size="29" fill="#666666">Runs on your PC —</text>
    <text x="1065" y="244" font-size="29" fill="#666666">no backend AI server.</text>
    <rect x="950" y="345" width="570" height="210" rx="28" fill="#F2F2F4"/>
    <circle cx="1020" cy="420" r="26" fill="none" stroke="#F05252" stroke-width="9"/>
    <ellipse cx="1020" cy="420" rx="11" ry="26" fill="none" stroke="#F05252" stroke-width="7"/>
    <text x="1065" y="412" font-size="36" font-weight="bold" fill="#16161A">Zero telemetry,</text>
    <text x="1065" y="452" font-size="36" font-weight="bold" fill="#16161A">100% privacy</text>
    <text x="1065" y="498" font-size="28" fill="#666666">No data collection.</text>
    <text x="1065" y="532" font-size="28" fill="#666666">Nothing is sent.</text>
    <rect x="950" y="600" width="570" height="210" rx="28" fill="#F2F2F4"/>
    <path d="M1032 386 L1004 424 h20 L1008 462 L1036 420 h-20 Z" fill="#F05252"/>
    <text x="1065" y="672" font-size="38" font-weight="bold" fill="#16161A">Light on battery</text>
    <text x="1065" y="716" font-size="29" fill="#666666">Sips power.</text>
    <text x="1065" y="752" font-size="29" fill="#666666">You will never notice it.</text>
